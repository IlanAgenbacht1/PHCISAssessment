# Demo stack: Postgres plus the app with migrations and demo data applied on startup.
#   docker compose up --build    then open http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: phcis_booking
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Development so cookies work over plain http and the API docs are on /scalar. Not for real use.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Booking: Host=db;Port=5432;Database=phcis_booking;Username=postgres;Password=postgres

volumes:
  pgdata:
